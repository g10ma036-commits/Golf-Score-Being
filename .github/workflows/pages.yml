# スマホ単独版を GitHub Pages に公開する。
# main ブランチに push するたびに、テスト → npm run build:phone → dist/phone-app を公開、を自動で行う。
# 初回だけ GitHub のリポジトリで Settings → Pages → Source を「GitHub Actions」にしておく。
name: スマホ単独版を公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: テスト
        run: npm test
      - name: スマホ単独版を作る
        run: npm run build:phone
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/phone-app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
